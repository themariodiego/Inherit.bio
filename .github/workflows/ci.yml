name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs may stop; main/release runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  INHERIT_TEST_JURISDICTION: "1"
  BYOK_ENCRYPTION_KEY: 5vL1kK0jgWTTr0oQvIrnT2mWXBPY0R1JX0uKTdcm9Ug=
  JOBS_SECRET: e2e-jobs-secret
  CRON_SECRET: e2e-cron-secret
  EMAIL_FROM: Inherit <inherit@e2e.local>
  RESEND_API_KEY: re_e2e_mock
  RESEND_BASE_URL: http://127.0.0.1:8124

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare private comparator denylist
        env:
          PRIVATE_NAME_DENYLIST: ${{ secrets.NAME_DENYLIST }}
        run: |
          if [ -z "$PRIVATE_NAME_DENYLIST" ]; then
            echo "::error::NAME_DENYLIST repository or organization secret is required"
            exit 1
          fi
          denylist_path="$RUNNER_TEMP/inherit-name-denylist.txt"
          printf '%s\n' "$PRIVATE_NAME_DENYLIST" > "$denylist_path"
          echo "NAME_DENYLIST_FILE=$denylist_path" >> "$GITHUB_ENV"
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Independently inventory the complete browser case set
        env:
          INHERIT_DISPOSABLE_LOCAL_E2E: "true"
        run: pnpm exec tsx scripts/ci-browser-shards.run.mts manifest
      - name: Save credential-free full browser inventory
        uses: actions/upload-artifact@v4
        with:
          name: browser-case-manifest-${{ github.run_attempt }}
          path: test-results/ci-browser-manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Unit tests
        run: pnpm test
      - name: Legal placeholder gate
        run: pnpm gate:legal
      - name: First-glance heading gate
        run: pnpm gate:first-glance
      - name: No-comparator name gate
        run: pnpm gate:names
      - name: Template integrity gate
        run: pnpm gate:templates
      - name: Readability and vocabulary gate
        run: pnpm gate:readability
      - name: Repository and history secret gate
        run: pnpm gate:secrets
      - name: Route register gate
        run: pnpm gate:routes
      - name: Claims and provenance gate
        run: pnpm gate:claims
      - name: Environment template gate
        run: pnpm gate:env
      - name: Jurisdiction review gate
        run: pnpm gate:jurisdictions
      - name: Start local Supabase
        run: pnpm exec supabase start
      - name: Export current local Supabase keys
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Database tests (pgTAP)
        run: pnpm exec supabase test db
      - name: Invitation transition locks (independent database sessions)
        run: pnpm test:invitation-locks
      - name: Seed local Supabase
        run: pnpm seed
      # Not drift detection: the catalog was seeded from data/templates one step
      # earlier. This proves the gate's database path and that its model of what
      # the seed writes still matches scripts/seed.ts, so a deployed comparison
      # can be trusted in either direction (D-134).
      - name: Catalog drift gate, seed self-consistency
        run: |
          eval "$(pnpm exec supabase status -o env)"
          SUPABASE_DB_URL="$DB_URL" pnpm gate:catalog-drift
      - name: Prepare credential-free isolated Linux runtime image
        run: docker build --tag inherit-ci-browser:local --file scripts/ci-browser/Dockerfile scripts/ci-browser
      - name: Production build with current local public configuration
        env:
          INHERIT_DISPOSABLE_LOCAL_E2E: "true"
        run: |
          pnpm build
          pnpm exec tsx scripts/ci-browser-runtime.run.mts record-build
      - name: Legal placeholder gate, rendered pages
        env:
          INHERIT_DISPOSABLE_LOCAL_E2E: "true"
        run: |
          set -euo pipefail
          pnpm exec next start --port 3199 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3199/about; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::built server never answered on 3199; the rendered gate checked nothing"
            exit 1
          fi
          SERVER_URL=http://127.0.0.1:3199 pnpm gate:legal
      # G1.16: the G1.14 Lighthouse contract (three exact routes, three cold
      # runs each, median performance >= 90, accessibility 100 on every run,
      # exact URLs, Document 200 and signed-in content) executed on the same
      # served build, independently seeded database and real Storage proxy.
      # Its one fixture upload crosses the real local provider like the rest.
      - name: Lighthouse gate on the isolated runtime
        env:
          INHERIT_DISPOSABLE_LOCAL_E2E: "true"
        run: pnpm e2e:lighthouse
      # D-106's sibling gap, found while root-causing a browser failure that
      # could not be reproduced: the blocking screen names which precondition
      # was missing, Playwright writes that to test-results/error-context.md,
      # and CI discarded it. An unreproducible failure with its evidence
      # thrown away costs a whole investigation and still ends in a guess.
      # Failure only, and every fixture in this suite is synthetic by
      # construction, so nothing here carries a real person's data.
      - name: Keep the failing browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ github.run_attempt }}-repository
          path: |
            test-results/**/error-context.md
            test-results/**/*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Clean up only the owned browser runtime
        if: always()
        env:
          INHERIT_DISPOSABLE_LOCAL_E2E: "true"
        run: pnpm exec tsx scripts/ci-browser-runtime.run.mts cleanup
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      INHERIT_DISPOSABLE_LOCAL_E2E: "true"
    steps:
      - name: Start setup wall-time measurement
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/inherit-ci-setup-start",String(Date.now()))'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start this job's fresh local Supabase
        run: pnpm exec supabase start
      - name: Export this job's local Supabase keys
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Seed this job's independent database
        run: pnpm seed
      - name: Prepare the unchanged credential-free isolated runtime image
        run: docker build --tag inherit-ci-browser:local --file scripts/ci-browser/Dockerfile scripts/ci-browser
      - name: Build and bind the exact checkout and local public configuration
        run: |
          build_start=$(node -e 'process.stdout.write(String(Date.now()))')
          pnpm build
          pnpm exec tsx scripts/ci-browser-runtime.run.mts record-build
          mkdir -p test-results
          node -e 'const fs=require("node:fs"),start=Number(fs.readFileSync(process.env.RUNNER_TEMP+"/inherit-ci-setup-start","utf8")),build=Number(process.argv[1]);fs.writeFileSync("test-results/ci-browser-setup-timings.json",JSON.stringify({setupMs:build-start,buildMs:Date.now()-build}))' "$build_start"
      - name: Execute the assigned part of the unchanged full suite
        run: pnpm exec tsx scripts/run-upload-browser.mts --ci-shard=${{ matrix.shard }}/6
      - name: Save only sanitized exact case coverage
        uses: actions/upload-artifact@v4
        with:
          name: browser-case-shard-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/ci-browser-shard.json
          retention-days: 14
          if-no-files-found: error
      - name: Keep safe failing browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            test-results/**/error-context.md
            test-results/**/*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Clean up only this job's owned runtime
        if: always()
        run: pnpm exec tsx scripts/ci-browser-runtime.run.mts cleanup
      - name: Stop only this job's fresh Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  # Keep the existing required check name. A failed, skipped or cancelled job
  # family cannot turn this release gate green, even with stale artifacts.
  checks:
    if: always()
    needs: [repository-checks, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      INHERIT_DISPOSABLE_LOCAL_E2E: "true"
      REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - name: Require every prerequisite job to succeed
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-case-*-${{ github.run_attempt }}*
          path: ci-browser-coverage
      - name: Require exact expected, assigned and executed case equality
        run: pnpm exec tsx scripts/ci-browser-shards.run.mts aggregate ci-browser-coverage

# Deploys the two Cloudflare Workers behind hosted preparation (ADR-0030): the
# private prepared-artifact gateway and the cron-woken container Worker that
# runs `pnpm worker:prepared --once`. Nothing runs until the owner sets the
# repository variable CLOUDFLARE_DEPLOY_ENABLED to true; until then every run
# is skipped and main stays green. The API token and account id live in the
# `cloudflare` environment and reach only the two wrangler steps.
name: Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/deploy-cloudflare.yml"
      - "data/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/cloudflare-deploy-guard.ts"
      - "scripts/prepared-worker.run.mts"
      - "scripts/server-only-shim.mjs"
      - "src/**"
      - "tsconfig.json"
      - "workers/**"
  workflow_dispatch:
    inputs:
      target:
        description: Which pair of Workers to deploy
        type: choice
        default: production
        options:
          - production
          - preview

permissions:
  contents: read

# One deploy per target at a time, queued rather than cancelled: a cancelled
# run can leave the gateway and the container Worker on different revisions.
concurrency:
  group: deploy-cloudflare-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: cloudflare
    env:
      DEPLOY_TARGET: ${{ inputs.target || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse a gateway whose signing keys are empty or not the ones the app serves
        run: pnpm exec tsx scripts/cloudflare-deploy-guard.ts "$DEPLOY_TARGET"
      # wrangler's top-level environment is selected with an empty --env value;
      # the preview variant lives under env.preview in both configuration files.
      - name: Select the wrangler environment
        run: |
          if [ "$DEPLOY_TARGET" = preview ]; then
            echo "WRANGLER_ENV=preview" >> "$GITHUB_ENV"
          else
            echo "WRANGLER_ENV=" >> "$GITHUB_ENV"
          fi
      - name: Deploy the prepared-artifact gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.134.0 deploy --config workers/prepared-artifacts/wrangler.json --env "$WRANGLER_ENV"
      # Builds the image from workers/prepared-worker/Dockerfile with the
      # repository root as context (the runner's Docker), pushes it to the
      # account registry and deploys the Worker, container and cron together.
      - name: Build the image and deploy the preparation container Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.134.0 deploy --config workers/prepared-worker/wrangler.json --env "$WRANGLER_ENV"
